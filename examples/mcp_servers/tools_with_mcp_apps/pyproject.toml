[project]
name = "tools_with_mcp_apps"
version = "0.1.4"
description = "An MCP App that calls the same tool and other tools through a gateway"
requires-python = ">=3.10"
dependencies = ["arcade-mcp-server>=1.32.1,<2.0.0", "httpx>=0.28.0,<1.0.0"]

[project.optional-dependencies]
dev = ["arcade-mcp>=1.16.1,<2.0.0", "pytest>=8.1.2", "ruff>=0.6.7"]

[project.entry-points.arcade_toolkits]
toolkit_name = "tools_with_mcp_apps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_with_mcp_apps"]
